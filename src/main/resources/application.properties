spring.application.name=api-techservices
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${AIVEN_TRUSTSTORE_URL:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
